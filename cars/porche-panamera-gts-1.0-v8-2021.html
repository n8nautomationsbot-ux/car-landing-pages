<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض السيارة - جودة عالية من قوقل درايف</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        .car-header { text-align: center; margin-bottom: 25px; width: 100%; max-width: 750px; }
        .car-title { font-size: 26px; color: #38bdf8; margin-bottom: 8px; }
        .car-price { font-size: 22px; font-weight: bold; color: #4ade80; }
        .feed-container { width: 100%; max-width: 750px; display: flex; flex-direction: column; gap: 25px; }
        .image-card { background: #1e293b; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; background-color: #000; cursor: pointer; }
        .image-card img { width: 100%; height: auto; display: block; image-rendering: -webkit-optimize-contrast; }
        .lightbox { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.95); justify-content: center; align-items: center; padding: 20px; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
        .close-btn { position: absolute; top: 20px; left: 30px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; background: rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div class="car-header">
        <h1 class="car-title">تفاصيل السيارة: عرض حصري</h1>
        <p class="car-price">السعر: يرجى التواصل</p>
    </div>
    <div class="feed-container" id="image-feed"></div>
    <div class="lightbox" id="lightbox">
        <span class="close-btn" id="close-lightbox">&times;</span>
        <img id="lightbox-img" src="" alt="صورة مكبرة">
    </div>
    <script>
        const carImages = [
    "https://lh3.googleusercontent.com/d/1NzS_IPoyU7tjzQcxg_mI_vHZ1YW78fis=s1000",
    "https://lh3.googleusercontent.com/d/1c7w7a7BCKqh8hGcajBexaelomHae3_XE=s1000",
    "https://lh3.googleusercontent.com/d/1urKa9yPEoRZd7wbZdB2BXdvk8Vrace3L=s1000",
    "https://lh3.googleusercontent.com/d/10UScoX5TzO_W8wNI_mwO9-ikx3dUigqU=s1000",
    "https://lh3.googleusercontent.com/d/118kwcZ8wwthtW2okuSfMD1GWdOBDxmpu=s1000",
    "https://lh3.googleusercontent.com/d/1rerODAPXRIwLoRporqyRmzqkyJYh6wUi=s1000",
    "https://lh3.googleusercontent.com/d/1cC3rJXH-NCugJ7mABAmQOmg-fbO2a0dF=s1000",
    "https://lh3.googleusercontent.com/d/1tS4RbQ02rD0Ym3XM1Ut4jLiGn6eSg-8E=s1000",
    "https://lh3.googleusercontent.com/d/1ZdSQwOm5C7UlF01S9b3RJxXCwQ8X0OB9=s1000",
    "https://lh3.googleusercontent.com/d/1ZqNTr2xjx8yIc5VcnZa8TB_CTVYKc1S3=s1000",
    "https://lh3.googleusercontent.com/d/1TiKog6JCd04cdgADd6Llk2d6Kkc2v5qx=s1000",
    "https://lh3.googleusercontent.com/d/1DFzrrAVe-seQcl1aXVd_lccil7_JuZ9C=s1000",
    "https://lh3.googleusercontent.com/d/1mYvyYk5X7r94zwaP9mQZSB-KXwS9J9NM=s1000",
    "https://lh3.googleusercontent.com/d/18Z_iGh7VaQpJiejQ0AbJm8kUpOArHYcb=s1000",
    "https://lh3.googleusercontent.com/d/1NFA0Ea4bF373-w_7bVnSbUg92IeZtXoj=s1000",
    "https://lh3.googleusercontent.com/d/1ItJ3u8RHtMQY-nozKHmR0mY0JnZE0vR4=s1000",
    "https://lh3.googleusercontent.com/d/1NGAOSOj2tJgELdSwQyD0CI2aCJ0qchCm=s1000",
    "https://lh3.googleusercontent.com/d/1-lGGsvTce1cgAAKPzMlqe-qVY-UN-FIP=s1000",
    "https://lh3.googleusercontent.com/d/1kI9rBR7LcMcFnDJHO8rHPZIE1Z2iOI13=s1000",
    "https://lh3.googleusercontent.com/d/1hTEWTItqWFUp82FHVP-wDwONSnfOlUdt=s1000",
    "https://lh3.googleusercontent.com/d/1xhVt3IzTFnXwbtA4q8ghiwvHsGgti0fX=s1000",
    "https://lh3.googleusercontent.com/d/17jgecwPWCfHQo2JPn43-lnfKGmJAPHYb=s1000",
    "https://lh3.googleusercontent.com/d/1vLXsRpGZwFcb1-buJIRr0EvIyD4jgjSM=s1000"
];

        const feedContainer = document.getElementById('image-feed');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeLightbox = document.getElementById('close-lightbox');

        if (carImages.length === 0) {
            feedContainer.innerHTML = "<p style='text-align:center;'>لا توجد صور متاحة حالياً.</p>";
        } else {
            carImages.forEach((url, index) => {
                const card = document.createElement('div');
                card.className = 'image-card';
                const img = document.createElement('img');
                img.src = url;
                img.alt = `صورة السيارة رقم ${index + 1}`;
                img.loading = "lazy";
                card.addEventListener('click', () => {
                    lightboxImg.src = url;
                    lightbox.classList.add('active');
                });
                card.appendChild(img);
                feedContainer.appendChild(card);
            });
        }
        closeLightbox.addEventListener('click', () => { lightbox.classList.remove('active'); });
        lightbox.addEventListener('click', (e) => { if (e.target === lightbox) { lightbox.classList.remove('active'); } });
    </script>
</body>
</html>
