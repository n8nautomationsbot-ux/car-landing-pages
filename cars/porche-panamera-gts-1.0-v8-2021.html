<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض السيارة - جودة عالية من قوقل درايف</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        .car-header { text-align: center; margin-bottom: 25px; width: 100%; max-width: 750px; }
        .car-title { font-size: 26px; color: #38bdf8; margin-bottom: 8px; }
        .car-price { font-size: 22px; font-weight: bold; color: #4ade80; }
        .feed-container { width: 100%; max-width: 750px; display: flex; flex-direction: column; gap: 25px; }
        .image-card { background: #1e293b; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; background-color: #000; cursor: pointer; }
        .image-card img { width: 100%; height: auto; display: block; image-rendering: -webkit-optimize-contrast; }
        .lightbox { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.95); justify-content: center; align-items: center; padding: 20px; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
        .close-btn { position: absolute; top: 20px; left: 30px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; background: rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div class="car-header">
        <h1 class="car-title">تفاصيل السيارة: عرض حصري</h1>
        <p class="car-price">السعر: يرجى التواصل</p>
    </div>
    <div class="feed-container" id="image-feed"></div>
    <div class="lightbox" id="lightbox">
        <span class="close-btn" id="close-lightbox">&times;</span>
        <img id="lightbox-img" src="" alt="صورة مكبرة">
    </div>
    <script>
        const carImages = [
    "https://lh3.googleusercontent.com/d/1FDq9iQeI9azpmCFpLvGPOK9ub3jDpPD9=s1000",
    "https://lh3.googleusercontent.com/d/1Xrzo05d5yu4A-gc9HQ0e171-ECzRiQta=s1000",
    "https://lh3.googleusercontent.com/d/1DIRSECvHMrMkrD5stcxvq10nQ86yfklc=s1000",
    "https://lh3.googleusercontent.com/d/1RcLO-L2OkaWrWb39vz57m0UcQQIMbVnF=s1000",
    "https://lh3.googleusercontent.com/d/1bIkVaD3V6lNFEQNUaezZdSsxa_Qa-0Uv=s1000",
    "https://lh3.googleusercontent.com/d/15Vw65WFGKbSnoKgT78XfqGQm_4ux087h=s1000",
    "https://lh3.googleusercontent.com/d/1_im5Dlj1tog7ttEy_Zrv3DmzFTaHtQ8R=s1000",
    "https://lh3.googleusercontent.com/d/1cGZKgQKo_3I0TJ1H882gjqmllhOrTH5M=s1000",
    "https://lh3.googleusercontent.com/d/12_n4KxbX7xFN5JSe846peb_hkFvOFKbN=s1000",
    "https://lh3.googleusercontent.com/d/1odOCLWLQus8KEDSlFwoZogR4bp2LgtFR=s1000",
    "https://lh3.googleusercontent.com/d/17p_4ITRrvalMnHKbZMuRFS81sG-tZCl7=s1000",
    "https://lh3.googleusercontent.com/d/1LqfGbFQ-QOv1o9dJ2S7B74dAsbLk5ETs=s1000",
    "https://lh3.googleusercontent.com/d/1UcqyPMMezG7xKTxsQ0KxtQmZe4isCvDF=s1000",
    "https://lh3.googleusercontent.com/d/1XP0WlEoQRLp6AQnZxJ8BCxEJM8tTwJ_P=s1000",
    "https://lh3.googleusercontent.com/d/1SvmAQTGa_LA8_DDVhFheWaRXIE0y0m1J=s1000",
    "https://lh3.googleusercontent.com/d/1OsZI4B7seFDWYH2xK1gC111BtFyI-6Wu=s1000",
    "https://lh3.googleusercontent.com/d/16wBtCN-v8w32hCvM4Z16ZgliwKlbG3cH=s1000",
    "https://lh3.googleusercontent.com/d/1-OWszreGFagDl8Eso1Hxp2t3MXIdTgbw=s1000",
    "https://lh3.googleusercontent.com/d/1bIglvd64mWaqG8dMoz6BaL_Z8zr60kUM=s1000",
    "https://lh3.googleusercontent.com/d/1SoMrgzPDRDOjiWzrze-2Y7NvojIAhhMD=s1000",
    "https://lh3.googleusercontent.com/d/1BknpJVR-PlrAYXdF-W5vnUMRKJIi8jQO=s1000",
    "https://lh3.googleusercontent.com/d/1iyIMubBwJgO1STK4VwCpSi_haGE1rY1I=s1000",
    "https://lh3.googleusercontent.com/d/1LtbPtfDUWEWyur1ayV0OWiw7OrK8KocN=s1000",
    "https://lh3.googleusercontent.com/d/1YJuxeam1S4HHw1T0wnddxUGXaFcfdZgd=s1000",
    "https://lh3.googleusercontent.com/d/1m0B-dxFdXhdWOqtdtwkOwQIIyZuF1Eqg=s1000",
    "https://lh3.googleusercontent.com/d/1SGXNp1AILE0EeUZTJDgsYkuX5rsi83Ue=s1000",
    "https://lh3.googleusercontent.com/d/1tjpSdheYm0CwL2PwSFCdV7SRiBSVgVSv=s1000",
    "https://lh3.googleusercontent.com/d/1a_iWrGCn42VeyStb8MNX38F6QxH5Fhc1=s1000",
    "https://lh3.googleusercontent.com/d/1Tif2z6saO2lwvaS43uorOWfHnmGO1aSp=s1000",
    "https://lh3.googleusercontent.com/d/1DvaPlgZQGJ3qGjDF_rtaecrEQgS5ODya=s1000"
];

        const feedContainer = document.getElementById('image-feed');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeLightbox = document.getElementById('close-lightbox');

        if (carImages.length === 0) {
            feedContainer.innerHTML = "<p style='text-align:center;'>لا توجد صور متاحة حالياً.</p>";
        } else {
            carImages.forEach((url, index) => {
                const card = document.createElement('div');
                card.className = 'image-card';
                const img = document.createElement('img');
                img.src = url;
                img.alt = `صورة السيارة رقم ${index + 1}`;
                img.loading = "lazy";
                card.addEventListener('click', () => {
                    lightboxImg.src = url;
                    lightbox.classList.add('active');
                });
                card.appendChild(img);
                feedContainer.appendChild(card);
            });
        }
        closeLightbox.addEventListener('click', () => { lightbox.classList.remove('active'); });
        lightbox.addEventListener('click', (e) => { if (e.target === lightbox) { lightbox.classList.remove('active'); } });
    </script>
</body>
</html>
