<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض السيارة - جودة عالية من قوقل درايف</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        .car-header { text-align: center; margin-bottom: 25px; width: 100%; max-width: 750px; }
        .car-title { font-size: 26px; color: #38bdf8; margin-bottom: 8px; }
        .car-price { font-size: 22px; font-weight: bold; color: #4ade80; }
        .feed-container { width: 100%; max-width: 750px; display: flex; flex-direction: column; gap: 25px; }
        .image-card { background: #1e293b; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; background-color: #000; cursor: pointer; }
        .image-card img { width: 100%; height: auto; display: block; image-rendering: -webkit-optimize-contrast; }
        .lightbox { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.95); justify-content: center; align-items: center; padding: 20px; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
        .close-btn { position: absolute; top: 20px; left: 30px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; background: rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div class="car-header">
        <h1 class="car-title">تفاصيل السيارة: عرض حصري</h1>
        <p class="car-price">السعر: يرجى التواصل</p>
    </div>
    <div class="feed-container" id="image-feed"></div>
    <div class="lightbox" id="lightbox">
        <span class="close-btn" id="close-lightbox">&times;</span>
        <img id="lightbox-img" src="" alt="صورة مكبرة">
    </div>
    <script>
        const carImages = [
    "https://lh3.googleusercontent.com/d/1IA84QqqNIJ7tDTu5XLgXtvuAFnWgpRg-=s1000",
    "https://lh3.googleusercontent.com/d/1d9CS8qAC5SC9_xkBE3FvvPF5hYkGIAgp=s1000",
    "https://lh3.googleusercontent.com/d/1q6wo_CjhaKLY_U3aq78uTPzFJFAoBky9=s1000",
    "https://lh3.googleusercontent.com/d/1IuZ9yuQ6yi4lfHAxDZ8cyOK8GMMrTdBQ=s1000",
    "https://lh3.googleusercontent.com/d/1NG9LaOVc8icci3aLPQy8lHbuD9aSPO2l=s1000",
    "https://lh3.googleusercontent.com/d/1A1Fpa_-QRs4ojAW6ctSWwiJtT1Avv8zN=s1000",
    "https://lh3.googleusercontent.com/d/16P0PpMJPGwNNL92rnD-OMFhBiQlRCTyL=s1000",
    "https://lh3.googleusercontent.com/d/1hC7sNRfHICqy5yvsnJd6ytEKSzbRoYRS=s1000",
    "https://lh3.googleusercontent.com/d/1cM8kiNoMJcyhpHTI5vdmMoM20SWL1y3F=s1000",
    "https://lh3.googleusercontent.com/d/1cLmf2ExWXETa4saWvOsPzsoM7U4vS-Xi=s1000",
    "https://lh3.googleusercontent.com/d/1bgvYNzLbpOiaF55BJ_hD71a1n6hAcD6l=s1000",
    "https://lh3.googleusercontent.com/d/19SACHp3_wkJigJIAY4bVo2n4Aqszkcle=s1000",
    "https://lh3.googleusercontent.com/d/1rCOPLcSA-O4a9aWRS1dnpmcel2JPILiA=s1000",
    "https://lh3.googleusercontent.com/d/1DBDGeuk7o9xwIoY8IxDgr-7CwE8Il7Ly=s1000",
    "https://lh3.googleusercontent.com/d/1sywx_HoF56Y0aYbdN-avYluYDBffiCWt=s1000",
    "https://lh3.googleusercontent.com/d/1wOnSvJV9YMx0rzhN_2b0-ulgvipovAqE=s1000",
    "https://lh3.googleusercontent.com/d/1iK2NDz7vzDjKMv7B9UNZQdZw9AkkWUCQ=s1000",
    "https://lh3.googleusercontent.com/d/1vnfYTJH-Ou5c4-42kvvF3D4SHXpwcyNQ=s1000",
    "https://lh3.googleusercontent.com/d/1yu4b5d08_gFizcgPtkwTUhJppOni-WHb=s1000",
    "https://lh3.googleusercontent.com/d/1EDwKicCipxnK744_9Qe__ckA0GU2SPMz=s1000",
    "https://lh3.googleusercontent.com/d/1nIV14PmARFBYV6yaJkLGh2ZXP8bjz3FD=s1000",
    "https://lh3.googleusercontent.com/d/1DQV6VliGfX72akWCQL9AkSymRPyxSho7=s1000",
    "https://lh3.googleusercontent.com/d/1ArobIOCswvwbor_kD5vXah3DTphsD_q3=s1000",
    "https://lh3.googleusercontent.com/d/1gmqc_s0YaPU6bfyqSEvZIhz8pf7ObN5c=s1000",

    "https://lh3.googleusercontent.com/d/1AxCJMumAyBeS0MH0YoqQE-mPAIW8mByw=s1000",
    "https://lh3.googleusercontent.com/d/13iUycZ8ayS3CjAQjrkEq1apjBrGdqsCW=s1000",
    "https://lh3.googleusercontent.com/d/16z8J6fMP6g9jZ2F1Lt3364B9VIlRBWcK=s1000",
    "https://lh3.googleusercontent.com/d/1T_vPy2jFceRYFPFiyupGM1-Fi-Dozcvp=s1000",
    "https://lh3.googleusercontent.com/d/1FO6OGIFBmN0LNlsOYZXQ5kTlDZ1HD7eP=s1000",
    "https://lh3.googleusercontent.com/d/1hCWKb6VXVGmrf6qJoZfdV4N0NaZu0HXe=s1000",
    "https://lh3.googleusercontent.com/d/1h7_4CtRyV0E87hmKAvDPZXHO5DyAUvaa=s1000",
    "https://lh3.googleusercontent.com/d/1-MBtjqkf0GevHvLsXIL1PSCYUbk-rHoe=s1000",
    "https://lh3.googleusercontent.com/d/1ppkcnaJKI4yHvvFIzjOwUbbwzorYHTJ_=s1000",
    "https://lh3.googleusercontent.com/d/1bq0yFC0UNEpEjvZMuvT9Xxng_P3_-0qp=s1000",
    "https://lh3.googleusercontent.com/d/1m4T5lAceVFlTtBNed24CFAbInC605po4=s1000"
];

        const feedContainer = document.getElementById('image-feed');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeLightbox = document.getElementById('close-lightbox');

        if (carImages.length === 0) {
            feedContainer.innerHTML = "<p style='text-align:center;'>لا توجد صور متاحة حالياً.</p>";
        } else {
            carImages.forEach((url, index) => {
                const card = document.createElement('div');
                card.className = 'image-card';
                const img = document.createElement('img');
                img.src = url;
                img.alt = `صورة السيارة رقم ${index + 1}`;
                img.loading = "lazy";
                card.addEventListener('click', () => {
                    lightboxImg.src = url;
                    lightbox.classList.add('active');
                });
                card.appendChild(img);
                feedContainer.appendChild(card);
            });
        }
        closeLightbox.addEventListener('click', () => { lightbox.classList.remove('active'); });
        lightbox.addEventListener('click', (e) => { if (e.target === lightbox) { lightbox.classList.remove('active'); } });
    </script>
</body>
</html>
