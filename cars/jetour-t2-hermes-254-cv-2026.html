<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض السيارة - جودة عالية من قوقل درايف</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        .car-header { text-align: center; margin-bottom: 25px; width: 100%; max-width: 750px; }
        .car-title { font-size: 26px; color: #38bdf8; margin-bottom: 8px; }
        .car-price { font-size: 22px; font-weight: bold; color: #4ade80; }
        .feed-container { width: 100%; max-width: 750px; display: flex; flex-direction: column; gap: 25px; }
        .image-card { background: #1e293b; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; background-color: #000; cursor: pointer; }
        .image-card img { width: 100%; height: auto; display: block; image-rendering: -webkit-optimize-contrast; }
        .lightbox { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.95); justify-content: center; align-items: center; padding: 20px; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
        .close-btn { position: absolute; top: 20px; left: 30px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; background: rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div class="car-header">
        <h1 class="car-title">تفاصيل السيارة: عرض حصري</h1>
        <p class="car-price">السعر: يرجى التواصل</p>
    </div>
    <div class="feed-container" id="image-feed"></div>
    <div class="lightbox" id="lightbox">
        <span class="close-btn" id="close-lightbox">&times;</span>
        <img id="lightbox-img" src="" alt="صورة مكبرة">
    </div>
    <script>
        const carImages = [
    "https://lh3.googleusercontent.com/d/1SqTzIBvABKrR-_qfGlEfouvC3vLChh9B=s1000",
    "https://lh3.googleusercontent.com/d/1dzHTZsfBmYNJA0Kv1jF5fE3obZnpPE1Q=s1000",
    "https://lh3.googleusercontent.com/d/1rKX-keQ-4VQN_YF8R4G0lvhvXdy-NwYq=s1000",
    "https://lh3.googleusercontent.com/d/1nQJcP1QVnm8GwMnrAvj9l74XpxX0_Zpr=s1000",
    "https://lh3.googleusercontent.com/d/1rphCpe2mllSxvy3hwPK4kelOsEkuyugN=s1000",
    "https://lh3.googleusercontent.com/d/1w8-eTLu50XsMO5j4Kf_ppdOK5Sd-01Lg=s1000",
    "https://lh3.googleusercontent.com/d/1qZ3HAOyVw517qffhkJV9Qsd9mWLkTvOe=s1000",
    "https://lh3.googleusercontent.com/d/1sBgxeexh7z4FwgrLlG0TnMZwEc805gg4=s1000",
    "https://lh3.googleusercontent.com/d/12-mGWMkuyU9wQG-N2gftVRMF0CYWPZ8F=s1000",
    "https://lh3.googleusercontent.com/d/1shQtzmJ8e4rfad19uvI4q39XjpQfX5eT=s1000",
    "https://lh3.googleusercontent.com/d/1-ZTUjQiwKlRXFr4REoR8ObEbOKp9kN5z=s1000",
    "https://lh3.googleusercontent.com/d/1xjUJvYg5TVmol0kWxLUnjnIZAdsTGMrX=s1000",
    "https://lh3.googleusercontent.com/d/1Sb62zONvxXje3_gXTu12nvMlL3DTo6XV=s1000",
    "https://lh3.googleusercontent.com/d/1oeXkKjFFO77yqWmSVcqA8aL9MsRAYRgz=s1000",
    "https://lh3.googleusercontent.com/d/1-TdEOErBp5N20HMKUW9UfwMA64w5fplt=s1000",
    "https://lh3.googleusercontent.com/d/1leSd_5I7UcrCTHhurZ3nkr457Q4h2R-A=s1000",
    "https://lh3.googleusercontent.com/d/1DGf89Rs_bRImQvhoY7YOd5dBQFeROdC7=s1000",
    "https://lh3.googleusercontent.com/d/16xSEqtVGYixvOQ5m1wsdYCC8RcE5-6fr=s1000",
    "https://lh3.googleusercontent.com/d/1T4iXT-UbomiD0Rh9gBVf664FaJ_q-RBf=s1000",
    "https://lh3.googleusercontent.com/d/1kindG2LqDfSV215UiQcd4jLqU-AmkHkH=s1000",
    "https://lh3.googleusercontent.com/d/1XYambGRuKLasWEycFLxzjUJsIVQzODbH=s1000",
    "https://lh3.googleusercontent.com/d/1FVri75LUkWqcM4c9j5LAJiyAUmn_SRj3=s1000",
    "https://lh3.googleusercontent.com/d/1j0XMc9va7RU3HbHKw875go0heqaILJ5s=s1000",
    "https://lh3.googleusercontent.com/d/1MnmFngSp8hBXzvOudSmBl2jsPt_NH0Ys=s1000",
    "https://lh3.googleusercontent.com/d/1P0cl1-ryI08cYW62ZpyDBl4LGr7HBb0u=s1000",
    "https://lh3.googleusercontent.com/d/1fmIZTnW2t6qI9fiULY-VaS0zqRbvT1Z7=s1000",
    "https://lh3.googleusercontent.com/d/1xVzNM-8RLGwZgUd3ibSNbKUKViOwsj6w=s1000",
    "https://lh3.googleusercontent.com/d/1oZ8pEcfi2abxkXwvhQsx_okBfMLB_R0J=s1000",
    "https://lh3.googleusercontent.com/d/1Z9XP0KXukkuRuAQiihG3jIU3Ady62Dhr=s1000",
    "https://lh3.googleusercontent.com/d/1ZBhuA5TsgbzXSrJYeVkBd7nvuPjp7gm9=s1000",
    "https://lh3.googleusercontent.com/d/13jkOr65Mse_OG6uRwiR9klot_1-2UNO_=s1000",
    "https://lh3.googleusercontent.com/d/1dTg8PxTyx71V5LnI0ydLi4K7HRhJXtCT=s1000"
];

        const feedContainer = document.getElementById('image-feed');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeLightbox = document.getElementById('close-lightbox');

        if (carImages.length === 0) {
            feedContainer.innerHTML = "<p style='text-align:center;'>لا توجد صور متاحة حالياً.</p>";
        } else {
            carImages.forEach((url, index) => {
                const card = document.createElement('div');
                card.className = 'image-card';
                const img = document.createElement('img');
                img.src = url;
                img.alt = `صورة السيارة رقم ${index + 1}`;
                img.loading = "lazy";
                card.addEventListener('click', () => {
                    lightboxImg.src = url;
                    lightbox.classList.add('active');
                });
                card.appendChild(img);
                feedContainer.appendChild(card);
            });
        }
        closeLightbox.addEventListener('click', () => { lightbox.classList.remove('active'); });
        lightbox.addEventListener('click', (e) => { if (e.target === lightbox) { lightbox.classList.remove('active'); } });
    </script>
</body>
</html>
