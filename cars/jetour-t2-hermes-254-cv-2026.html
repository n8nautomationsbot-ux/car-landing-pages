<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض السيارة - جودة عالية من قوقل درايف</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        .car-header { text-align: center; margin-bottom: 25px; width: 100%; max-width: 750px; }
        .car-title { font-size: 26px; color: #38bdf8; margin-bottom: 8px; }
        .car-price { font-size: 22px; font-weight: bold; color: #4ade80; }
        .feed-container { width: 100%; max-width: 750px; display: flex; flex-direction: column; gap: 25px; }
        .image-card { background: #1e293b; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; background-color: #000; cursor: pointer; }
        .image-card img { width: 100%; height: auto; display: block; image-rendering: -webkit-optimize-contrast; }
        .lightbox { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.95); justify-content: center; align-items: center; padding: 20px; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
        .close-btn { position: absolute; top: 20px; left: 30px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; background: rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div class="car-header">
        <h1 class="car-title">تفاصيل السيارة: عرض حصري</h1>
        <p class="car-price">السعر: يرجى التواصل</p>
    </div>
    <div class="feed-container" id="image-feed"></div>
    <div class="lightbox" id="lightbox">
        <span class="close-btn" id="close-lightbox">&times;</span>
        <img id="lightbox-img" src="" alt="صورة مكبرة">
    </div>
    <script>
        const carImages = [
    "https://lh3.googleusercontent.com/d/12KVAnSP_VByEqqp2TqVhkNeibW6BK8ha=s1000",
    "https://lh3.googleusercontent.com/d/1BRO85rcZST0VlpTFqLPftDNvMJtMSIvV=s1000",
    "https://lh3.googleusercontent.com/d/1r2D7XUGaf2zwULfqAXcujDCxYd9csm5-=s1000",
    "https://lh3.googleusercontent.com/d/1qDc5AwVTRUBegGg58P-qpjvuNpf18CVh=s1000",
    "https://lh3.googleusercontent.com/d/1DcLSHgU1nF241q--O4pm2A_eQS6u0h5a=s1000",
    "https://lh3.googleusercontent.com/d/1EZgcQLkUBm2qsTkW-d0Iic2kUkUc91jd=s1000",
    "https://lh3.googleusercontent.com/d/1X2aUpLdyb1J6Gk_a1cHRj3cHZbDFwwPR=s1000",
    "https://lh3.googleusercontent.com/d/1w-VaSOYRslJ7rQqSr0LoWpFqTmlbynEU=s1000",
    "https://lh3.googleusercontent.com/d/1Y5QcBC9L9-fskm1JyNkjNB2PbWvbt9CC=s1000",
    "https://lh3.googleusercontent.com/d/159YOY6F9bCQkx0LxmAQqPkigQ3PZSYWF=s1000",
    "https://lh3.googleusercontent.com/d/1OcYChV5Mc4Er25-n9pkS1sPSB3-_BSy_=s1000",
    "https://lh3.googleusercontent.com/d/1wr83gQtU1kCMlv8Mz1x4UywTM-1x58h7=s1000",
    "https://lh3.googleusercontent.com/d/1sBrRwI5Cx7k32xf9WhLQfTup5VLnyCKw=s1000",
    "https://lh3.googleusercontent.com/d/1rBlRQBamNvbOjL0OIltojZiSIouZZmj4=s1000",
    "https://lh3.googleusercontent.com/d/1ljJhbOWvbM3doZEKKV9mNBjJo4va0RsO=s1000",
    "https://lh3.googleusercontent.com/d/1maY_ESAUV1hI95BbbcnP3pXWKU0aqXZ_=s1000",
    "https://lh3.googleusercontent.com/d/1BEBdzBInaUti0lAJ8LP8AsLNBuGTafC6=s1000",
    "https://lh3.googleusercontent.com/d/1SiCG1hjcA9v7etvea5YSF2VZi7VZqKY_=s1000",
    "https://lh3.googleusercontent.com/d/192_oDIIMkayDgAPii4QK5WApgj89Axmx=s1000",
    "https://lh3.googleusercontent.com/d/1diAGvnTkdMKNPjd6rNL-TayTiaGkEesI=s1000",
    "https://lh3.googleusercontent.com/d/1At_5ZeK7NLSdeRH1Wse_q7O1z68hI5Qw=s1000",
    "https://lh3.googleusercontent.com/d/1-vmgK9nEz29Fkn21Npo4mmGnnQYbrlnf=s1000",
    "https://lh3.googleusercontent.com/d/18blRz3DnNBIXni_lml1krb8n7nF6skVi=s1000",
    "https://lh3.googleusercontent.com/d/16ZtMsODKAm2qiYi0K4kAqfZVYO5HoYlw=s1000",

    "https://lh3.googleusercontent.com/d/1PyMNb_y5c-K-he9rygaKhOuMfNT-HLoc=s1000",
    "https://lh3.googleusercontent.com/d/1mhiEzQAMrvFSw_wCLlV5Y-zZjrKdNpFp=s1000",
    "https://lh3.googleusercontent.com/d/1VoTe6QVuIpJI9WDgQUo-HwG3w9H1n6Tl=s1000",
    "https://lh3.googleusercontent.com/d/1NwNy-1yF1dbIB_-q1GBGE4QqpyqHoXvM=s1000",
    "https://lh3.googleusercontent.com/d/1Xfqdul2ZUg7C-Y0IHpxTMCGTqiAx-TOT=s1000",
    "https://lh3.googleusercontent.com/d/1DMrGP7zVXiqPBkYLYd_89hk614GdR2Zf=s1000",
    "https://lh3.googleusercontent.com/d/1yR5zcu9xReZP0VAZV-wfUg3MVkAgGLf9=s1000",
    "https://lh3.googleusercontent.com/d/1XMbI9ms2Xx3s-jxxsM85B-3lBq1KpKpI=s1000",
    "https://lh3.googleusercontent.com/d/1XwA8C3HAfA2OaWMLLAGQ1Gm8S-TdgNt8=s1000",
    "https://lh3.googleusercontent.com/d/1qVre0XivXmfBZ865JCnqSFPJaYg2dt_S=s1000",
    "https://lh3.googleusercontent.com/d/1NL0KNhbKrO8FIV97ss5M2szKT0M9mIPA=s1000"
];

        const feedContainer = document.getElementById('image-feed');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeLightbox = document.getElementById('close-lightbox');

        if (carImages.length === 0) {
            feedContainer.innerHTML = "<p style='text-align:center;'>لا توجد صور متاحة حالياً.</p>";
        } else {
            carImages.forEach((url, index) => {
                const card = document.createElement('div');
                card.className = 'image-card';
                const img = document.createElement('img');
                img.src = url;
                img.alt = `صورة السيارة رقم ${index + 1}`;
                img.loading = "lazy";
                card.addEventListener('click', () => {
                    lightboxImg.src = url;
                    lightbox.classList.add('active');
                });
                card.appendChild(img);
                feedContainer.appendChild(card);
            });
        }
        closeLightbox.addEventListener('click', () => { lightbox.classList.remove('active'); });
        lightbox.addEventListener('click', (e) => { if (e.target === lightbox) { lightbox.classList.remove('active'); } });
    </script>
</body>
</html>
