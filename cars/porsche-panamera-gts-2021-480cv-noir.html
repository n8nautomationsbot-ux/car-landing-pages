<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض السيارة - جودة عالية من قوقل درايف</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        .car-header { text-align: center; margin-bottom: 25px; width: 100%; max-width: 750px; }
        .car-title { font-size: 26px; color: #38bdf8; margin-bottom: 8px; }
        .car-price { font-size: 22px; font-weight: bold; color: #4ade80; }
        .feed-container { width: 100%; max-width: 750px; display: flex; flex-direction: column; gap: 25px; }
        .image-card { background: #1e293b; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; background-color: #000; cursor: pointer; }
        .image-card img { width: 100%; height: auto; display: block; image-rendering: -webkit-optimize-contrast; }
        .lightbox { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.95); justify-content: center; align-items: center; padding: 20px; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
        .close-btn { position: absolute; top: 20px; left: 30px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; background: rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div class="car-header">
        <h1 class="car-title">تفاصيل السيارة: عرض حصري</h1>
        <p class="car-price">السعر: يرجى التواصل</p>
    </div>
    <div class="feed-container" id="image-feed"></div>
    <div class="lightbox" id="lightbox">
        <span class="close-btn" id="close-lightbox">&times;</span>
        <img id="lightbox-img" src="" alt="صورة مكبرة">
    </div>
    <script>
        const carImages = [
    "https://lh3.googleusercontent.com/d/1hlBbSvZGPJQdSqWJenC5I-W1PzrpuHnt=s1000",
    "https://lh3.googleusercontent.com/d/1kN8f_5yadPsc7mN6dSXcISsgk1X_fm0f=s1000",
    "https://lh3.googleusercontent.com/d/10QHE7O4pYDXYKUCdNMNuGbxXwndZt6V0=s1000",
    "https://lh3.googleusercontent.com/d/1nNYedErsXIasHimgxDvoRudNUt7Lt47R=s1000",
    "https://lh3.googleusercontent.com/d/12Eeo_Zhgi4HPJYqYLPRSvsRJu6EgJ7sv=s1000",
    "https://lh3.googleusercontent.com/d/1h0N9BBPxEqhJCzW2IZC5UJq6K1As0wgx=s1000",
    "https://lh3.googleusercontent.com/d/1gceBr7q0Pth3kSueGcmlzWqhyKreJtKh=s1000",
    "https://lh3.googleusercontent.com/d/1_9dSuWRvWy33aDdctpZkRZHDa6yvMQG-=s1000",
    "https://lh3.googleusercontent.com/d/1bPla0nM6DQNmZj6W3GD9mtcmrZxVm3C9=s1000",
    "https://lh3.googleusercontent.com/d/1CVc1p3OrB7xaUIJwnjidUs8Rhmz7ggoQ=s1000",
    "https://lh3.googleusercontent.com/d/1FIR67UC_YxS9haxxYNg2lbj9jBH9fv8f=s1000",
    "https://lh3.googleusercontent.com/d/1x_zdpEuCJFfI0IBmiGaOc7g_LucDjrMK=s1000",
    "https://lh3.googleusercontent.com/d/1HY8wAzmRjSTkA9tU0iBRqn_IGAAP6KRq=s1000",
    "https://lh3.googleusercontent.com/d/1n6qSjEL70Wor9H_byyPwZ4-ldPt0QYqR=s1000",
    "https://lh3.googleusercontent.com/d/1WaLdhMBxakEPbYcrV4a2ChNv2ImOMKDv=s1000",
    "https://lh3.googleusercontent.com/d/11LU6VEz7IGg-ybHq28GoL3E8boXJr3f7=s1000",
    "https://lh3.googleusercontent.com/d/1M08Q1FRaQV-rlrKLsY9qNs9odji9LAoY=s1000",
    "https://lh3.googleusercontent.com/d/1tzTRlIIdF--SaCwNQiVbVcC-KAAUHaJB=s1000",
    "https://lh3.googleusercontent.com/d/16xVZjB7Dl-k3sndVumgY0ix6F2J8thO3=s1000",
    "https://lh3.googleusercontent.com/d/1a_ciTp3DAFvNHiU1zQbzReImr-ruP5xj=s1000",
    "https://lh3.googleusercontent.com/d/1TsnU3aVPPaDaXDHbLJyogx3yOIRMTYgF=s1000"
];

        const feedContainer = document.getElementById('image-feed');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeLightbox = document.getElementById('close-lightbox');

        if (carImages.length === 0) {
            feedContainer.innerHTML = "<p style='text-align:center;'>لا توجد صور متاحة حالياً.</p>";
        } else {
            carImages.forEach((url, index) => {
                const card = document.createElement('div');
                card.className = 'image-card';
                const img = document.createElement('img');
                img.src = url;
                img.alt = `صورة السيارة رقم ${index + 1}`;
                img.loading = "lazy";
                card.addEventListener('click', () => {
                    lightboxImg.src = url;
                    lightbox.classList.add('active');
                });
                card.appendChild(img);
                feedContainer.appendChild(card);
            });
        }
        closeLightbox.addEventListener('click', () => { lightbox.classList.remove('active'); });
        lightbox.addEventListener('click', (e) => { if (e.target === lightbox) { lightbox.classList.remove('active'); } });
    </script>
</body>
</html>
