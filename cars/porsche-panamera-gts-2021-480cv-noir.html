<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض السيارة - جودة عالية من قوقل درايف</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        .car-header { text-align: center; margin-bottom: 25px; width: 100%; max-width: 750px; }
        .car-title { font-size: 26px; color: #38bdf8; margin-bottom: 8px; }
        .car-price { font-size: 22px; font-weight: bold; color: #4ade80; }
        .feed-container { width: 100%; max-width: 750px; display: flex; flex-direction: column; gap: 25px; }
        .image-card { background: #1e293b; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; background-color: #000; cursor: pointer; }
        .image-card img { width: 100%; height: auto; display: block; image-rendering: -webkit-optimize-contrast; }
        .lightbox { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.95); justify-content: center; align-items: center; padding: 20px; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
        .close-btn { position: absolute; top: 20px; left: 30px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; background: rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div class="car-header">
        <h1 class="car-title">تفاصيل السيارة: عرض حصري</h1>
        <p class="car-price">السعر: يرجى التواصل</p>
    </div>
    <div class="feed-container" id="image-feed"></div>
    <div class="lightbox" id="lightbox">
        <span class="close-btn" id="close-lightbox">&times;</span>
        <img id="lightbox-img" src="" alt="صورة مكبرة">
    </div>
    <script>
        const carImages = [
    "https://lh3.googleusercontent.com/d/1OMmG0bkrZeRs_0m5C--YCvotygpUm3oa=s1000",
    "https://lh3.googleusercontent.com/d/1BdybPSyZ535mYjr0ICO-f9neWiG5_E8S=s1000",
    "https://lh3.googleusercontent.com/d/1xmpq-lhXvQEy5-nZME-eoaBySOidJZsa=s1000",
    "https://lh3.googleusercontent.com/d/1gYvdOC2xjP_cjnbxokbuKvQIgsaLK7Ob=s1000",
    "https://lh3.googleusercontent.com/d/1Vd4dPxlU1mhaZmaVZOjhZl_9RkEdoRDr=s1000",
    "https://lh3.googleusercontent.com/d/1StGzL5qNCywS5Xqa8JGSSdvEw_L3rM4f=s1000",
    "https://lh3.googleusercontent.com/d/1klEJD3mTqBlDH5MlRGdlMtc8opcjQz-z=s1000",
    "https://lh3.googleusercontent.com/d/1Q7XZYiw2RTfd7DcByzP6icxHto3cfaxu=s1000",
    "https://lh3.googleusercontent.com/d/1w4vz6XGSVVHKwJ4Oxe4wmzs5R80fHV6s=s1000",
    "https://lh3.googleusercontent.com/d/1QalRzu3UxBIzQs5tQW83b3T03lE4xlKh=s1000",
    "https://lh3.googleusercontent.com/d/1acX3XyiioovtkAoNBRqQciAita8jXDn_=s1000",
    "https://lh3.googleusercontent.com/d/1Um_H8aKVSVfZdotbxLla0XJb31yjg0qj=s1000",
    "https://lh3.googleusercontent.com/d/16kq_ZJC6uXfWIyLiE24giA8vvucsi75B=s1000",
    "https://lh3.googleusercontent.com/d/1QHuyNrbmoUmUSMmTHfkHE95xCoV0pM9y=s1000",
    "https://lh3.googleusercontent.com/d/1wJ8edfguFQVQlFCoKUJqyEkG0jn7RA_d=s1000",
    "https://lh3.googleusercontent.com/d/16oBoAKj8lSy4QX9sHNFvHzkga5Vvz87W=s1000",
    "https://lh3.googleusercontent.com/d/1Lx10SeH7JnTmwThwFzC29lPpC0cm59wt=s1000",
    "https://lh3.googleusercontent.com/d/1WVB57FCGg8Z5rSepHPmF16sNMvtii97H=s1000",
    "https://lh3.googleusercontent.com/d/1KPMnxEthsLeoRpxCvdoYR1KNP34IeLgA=s1000",
    "https://lh3.googleusercontent.com/d/1xAF-BoqzHrAU1pJGKbB59eNu6m33KBYs=s1000",
    "https://lh3.googleusercontent.com/d/1fjO5ls-8FsB8yteS0RSmZtnhPHYcrnOq=s1000"
];

        const feedContainer = document.getElementById('image-feed');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeLightbox = document.getElementById('close-lightbox');

        if (carImages.length === 0) {
            feedContainer.innerHTML = "<p style='text-align:center;'>لا توجد صور متاحة حالياً.</p>";
        } else {
            carImages.forEach((url, index) => {
                const card = document.createElement('div');
                card.className = 'image-card';
                const img = document.createElement('img');
                img.src = url;
                img.alt = `صورة السيارة رقم ${index + 1}`;
                img.loading = "lazy";
                card.addEventListener('click', () => {
                    lightboxImg.src = url;
                    lightbox.classList.add('active');
                });
                card.appendChild(img);
                feedContainer.appendChild(card);
            });
        }
        closeLightbox.addEventListener('click', () => { lightbox.classList.remove('active'); });
        lightbox.addEventListener('click', (e) => { if (e.target === lightbox) { lightbox.classList.remove('active'); } });
    </script>
</body>
</html>
