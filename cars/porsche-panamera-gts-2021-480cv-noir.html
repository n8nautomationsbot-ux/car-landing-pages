<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض السيارة - جودة عالية من قوقل درايف</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        .car-header { text-align: center; margin-bottom: 25px; width: 100%; max-width: 750px; }
        .car-title { font-size: 26px; color: #38bdf8; margin-bottom: 8px; }
        .car-price { font-size: 22px; font-weight: bold; color: #4ade80; }
        .feed-container { width: 100%; max-width: 750px; display: flex; flex-direction: column; gap: 25px; }
        .image-card { background: #1e293b; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; background-color: #000; cursor: pointer; }
        .image-card img { width: 100%; height: auto; display: block; image-rendering: -webkit-optimize-contrast; }
        .lightbox { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.95); justify-content: center; align-items: center; padding: 20px; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
        .close-btn { position: absolute; top: 20px; left: 30px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; background: rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div class="car-header">
        <h1 class="car-title">تفاصيل السيارة: عرض حصري</h1>
        <p class="car-price">السعر: يرجى التواصل</p>
    </div>
    <div class="feed-container" id="image-feed"></div>
    <div class="lightbox" id="lightbox">
        <span class="close-btn" id="close-lightbox">&times;</span>
        <img id="lightbox-img" src="" alt="صورة مكبرة">
    </div>
    <script>
        const carImages = [
    "https://lh3.googleusercontent.com/d/1A2Spybe9h8FqF5TQqgh9ArJb9cmCCRks=s1000",
    "https://lh3.googleusercontent.com/d/1sRrMBmDgrQuQrRGSUVFOLcJBeEDd5CzZ=s1000",
    "https://lh3.googleusercontent.com/d/1wLaHISM7KO6FR8_w2XH_oY91XOwnHWfB=s1000",
    "https://lh3.googleusercontent.com/d/15nr4CnhfUSbn5zm5lz8IPqdPhLgp-8cT=s1000",
    "https://lh3.googleusercontent.com/d/1EfwAwgP5-2q8Cik_XdoFS0XU608Dzqvc=s1000",
    "https://lh3.googleusercontent.com/d/1r0zZOOKy6J_NnWSq7HQFF5f6OsSdZnTb=s1000",
    "https://lh3.googleusercontent.com/d/1_LCX4W4mxPOSLbNKK34BQ-7ZW8F2KrDJ=s1000",
    "https://lh3.googleusercontent.com/d/1Rdp1QWvsEkmqZI7B5W3hJrSLXRJqqEMj=s1000",
    "https://lh3.googleusercontent.com/d/1tXnVJaIOIGJ6yP3R5hdptYeI22ag2Ru7=s1000",
    "https://lh3.googleusercontent.com/d/1adDBW_TVw7AMhUH0zeoQ05sAVdZU4NCO=s1000",
    "https://lh3.googleusercontent.com/d/1OmX-JXv5Ym4RLCpi1Vk8ptYH8O48slrG=s1000",
    "https://lh3.googleusercontent.com/d/1wKaW023XXfa7Vcx9InB3NMLGxUVAKxii=s1000",
    "https://lh3.googleusercontent.com/d/1J-5WZCGsGH49YWTFwdyCgJknlEd66jVu=s1000",
    "https://lh3.googleusercontent.com/d/1vFGmsa0d9zHQuDRhnTQW0wMJkl8-lk1b=s1000",
    "https://lh3.googleusercontent.com/d/1bIb5EeEOIYgnyDyj4ga8HEXAIq_Md_DO=s1000",
    "https://lh3.googleusercontent.com/d/1mF3eJKnneNrIRZ9cMpQvNEJQ6Rs2K8b1=s1000",
    "https://lh3.googleusercontent.com/d/126ibutWj8V0iFRlaeB38E6cUExLZk0FP=s1000",
    "https://lh3.googleusercontent.com/d/1h2GPcg5nLb5Qoqaqx2DWTtY3hN6vBs1t=s1000",
    "https://lh3.googleusercontent.com/d/1VcTmK4ArtCdYeExJH3HioF8ngIp3tqZv=s1000",
    "https://lh3.googleusercontent.com/d/15Xp9wkhYOC_lHDPoQfmFvdwFIgfxs24O=s1000",
    "https://lh3.googleusercontent.com/d/1OzwKV-zvnFD6beGaaddwAvqEuVpwwvKB=s1000"
];

        const feedContainer = document.getElementById('image-feed');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeLightbox = document.getElementById('close-lightbox');

        if (carImages.length === 0) {
            feedContainer.innerHTML = "<p style='text-align:center;'>لا توجد صور متاحة حالياً.</p>";
        } else {
            carImages.forEach((url, index) => {
                const card = document.createElement('div');
                card.className = 'image-card';
                const img = document.createElement('img');
                img.src = url;
                img.alt = `صورة السيارة رقم ${index + 1}`;
                img.loading = "lazy";
                card.addEventListener('click', () => {
                    lightboxImg.src = url;
                    lightbox.classList.add('active');
                });
                card.appendChild(img);
                feedContainer.appendChild(card);
            });
        }
        closeLightbox.addEventListener('click', () => { lightbox.classList.remove('active'); });
        lightbox.addEventListener('click', (e) => { if (e.target === lightbox) { lightbox.classList.remove('active'); } });
    </script>
</body>
</html>
