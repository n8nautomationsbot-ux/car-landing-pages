<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض السيارة - جودة عالية من قوقل درايف</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        .car-header { text-align: center; margin-bottom: 25px; width: 100%; max-width: 750px; }
        .car-title { font-size: 26px; color: #38bdf8; margin-bottom: 8px; }
        .car-price { font-size: 22px; font-weight: bold; color: #4ade80; }
        .feed-container { width: 100%; max-width: 750px; display: flex; flex-direction: column; gap: 25px; }
        .image-card { background: #1e293b; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; background-color: #000; cursor: pointer; }
        .image-card img { width: 100%; height: auto; display: block; image-rendering: -webkit-optimize-contrast; }
        .lightbox { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.95); justify-content: center; align-items: center; padding: 20px; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
        .close-btn { position: absolute; top: 20px; left: 30px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; background: rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div class="car-header">
        <h1 class="car-title">تفاصيل السيارة: عرض حصري</h1>
        <p class="car-price">السعر: يرجى التواصل</p>
    </div>
    <div class="feed-container" id="image-feed"></div>
    <div class="lightbox" id="lightbox">
        <span class="close-btn" id="close-lightbox">&times;</span>
        <img id="lightbox-img" src="" alt="صورة مكبرة">
    </div>
    <script>
        const carImages = [
    "https://lh3.googleusercontent.com/d/1-_tPDxNyT0Y4Wjp73yNV9j1ZpwiWz6wQ=s1000",
    "https://lh3.googleusercontent.com/d/1ZwWhNyQ1ZmgxPqDXsdrKSER4yG6hFuhr=s1000",
    "https://lh3.googleusercontent.com/d/1icdGgNTnuQig-ykdLL38SmbNPIGyghfW=s1000",
    "https://lh3.googleusercontent.com/d/17fEG1XH5E1rss9PasTwS3UAb1IbtvXv4=s1000",
    "https://lh3.googleusercontent.com/d/1F4WLbZbOHri2q9PmetdWJB35Cp_Y-PF7=s1000",
    "https://lh3.googleusercontent.com/d/1K3OvWDr3hNO3itv_h_g59lpfsyGyQrmx=s1000",
    "https://lh3.googleusercontent.com/d/1VODPf7pcxmVN4jnclMrqOWz2M1rjlRZs=s1000",
    "https://lh3.googleusercontent.com/d/1P_LE5XkARKqylpwwbid7Dpz7QTiuzhCF=s1000",
    "https://lh3.googleusercontent.com/d/197jghGZgJq6N0QH--x6x2WtHwrnYH3XV=s1000",
    "https://lh3.googleusercontent.com/d/1XB_kWGRE6xOpuoI5kA6K8ek9WSi2OU4w=s1000",
    "https://lh3.googleusercontent.com/d/1SY8RYbeIqhUjduFDghzlGsJSiCrPfTVM=s1000",
    "https://lh3.googleusercontent.com/d/15vgLOGKk9ddBLCYlgUMfSTgD_JZV5xuD=s1000",
    "https://lh3.googleusercontent.com/d/1vJJrbJ0oNAtxA5ftQQQl46jh1yevrBqW=s1000",
    "https://lh3.googleusercontent.com/d/1m7knv5ogzWGCz3B6GFtz2BXz99g2nfhF=s1000",
    "https://lh3.googleusercontent.com/d/1mx-X7OD99_LQNgiWYtbktq_XpBIG9gX6=s1000",
    "https://lh3.googleusercontent.com/d/1CPl7is-Tsj-g3HwirI4l1Z5oj_XXhZ4k=s1000",
    "https://lh3.googleusercontent.com/d/1Ilk6T4IUkrXNCe1GgA7F6Ht9SCtqNtqD=s1000",
    "https://lh3.googleusercontent.com/d/1nKnSfz67IHFi0cS8nWT3JUiY-YtH4euU=s1000",
    "https://lh3.googleusercontent.com/d/1uNgGLCSFcwkkI-DJSZP4XK3XaUf7dwlE=s1000",
    "https://lh3.googleusercontent.com/d/1bNZfLkQl4kSVZYxEHmD-ycW24e31xFNy=s1000",
    "https://lh3.googleusercontent.com/d/1NNiSk8ts4dwah55p4rUaz7jvnnwO9EHc=s1000"
];

        const feedContainer = document.getElementById('image-feed');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeLightbox = document.getElementById('close-lightbox');

        if (carImages.length === 0) {
            feedContainer.innerHTML = "<p style='text-align:center;'>لا توجد صور متاحة حالياً.</p>";
        } else {
            carImages.forEach((url, index) => {
                const card = document.createElement('div');
                card.className = 'image-card';
                const img = document.createElement('img');
                img.src = url;
                img.alt = `صورة السيارة رقم ${index + 1}`;
                img.loading = "lazy";
                card.addEventListener('click', () => {
                    lightboxImg.src = url;
                    lightbox.classList.add('active');
                });
                card.appendChild(img);
                feedContainer.appendChild(card);
            });
        }
        closeLightbox.addEventListener('click', () => { lightbox.classList.remove('active'); });
        lightbox.addEventListener('click', (e) => { if (e.target === lightbox) { lightbox.classList.remove('active'); } });
    </script>
</body>
</html>
